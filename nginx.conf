worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;
env AI_RPC_TOKEN;
env FIBER_TOKYO_BISCUIT_TOKEN;
env FIBER_CA_BISCUIT_TOKEN;
events { worker_connections 1024; }
http {
    lua_package_path "/etc/nginx/lua/?.lua;;";
    default_type application/json;
    # Never log request bodies, query strings or authentication headers.
    log_format rpc '$remote_addr [$time_local] $request_method $uri $status $request_time';
    access_log /var/log/nginx/access.log rpc;
    client_max_body_size 256k;
    client_body_buffer_size 256k;
    client_body_timeout 10s;
    keepalive_timeout 30s;
    limit_req_zone $binary_remote_addr zone=rpc_rate:10m rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=rpc_connections:10m;
    server {
        listen 80;
        server_name _;
        location /rpc/ {
            set $fiber_upstream "";
            set $fiber_authorization "";
            limit_req zone=rpc_rate burst=10 nodelay;
            limit_req_status 429;
            limit_conn rpc_connections 5;
            limit_conn_status 429;
            access_by_lua_file /etc/nginx/lua/access.lua;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $fiber_upstream;
            proxy_set_header Authorization $fiber_authorization;
            proxy_set_header Content-Type application/json;
            proxy_set_header Accept-Encoding "";
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            proxy_pass http://$fiber_upstream/;
        }
        location / { return 404; }
    }
}
