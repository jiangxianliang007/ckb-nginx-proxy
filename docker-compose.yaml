services:
  fiber-rpc-gateway:
    build: .
    restart: unless-stopped
    ports:
      - "0.0.0.0:80:80"
    env_file:
      - .env
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./lua:/etc/nginx/lua:ro
    healthcheck:
      test: ["CMD", "curl", "--noproxy", "*", "-fsS", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
